<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Academy</title>
<meta name="description" content="Learn machine learning, deep learning, generative AI and AI agents from zero, with live simulations, code and the best free resources.">
<meta name="theme-color" content="#1A1440">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AI Academy">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap">
<style>

:root{
  --rail:#1A1440; --rail-2:#2C2366; --rail-ink:#B8B2E6;
  --bg:#F5F4FA; --card:#FFFFFF; --ink:#1B1838; --ink-2:#4A4766; --ink-3:#6E6B88; --line:#DEDCEB; --line-2:#EEEDF6;
  --blue:#5B3FD9; --blue-2:#ECE8FD; --blue-ink:#4529B8;
  --green:#00795B; --green-bg:#E0F5EE; --amber:#9A6200; --amber-bg:#FDF1D8; --red:#C42B1C; --red-bg:#FCE7E4;
  --violet:#6B3FB5; --violet-bg:#EFE8FA; --teal:#00727A; --teal-bg:#DDF2F3;
  --p-low:#00795B; --p-med:#2C5CC5; --p-high:#C25A00; --p-urg:#C42B1C;
  --shadow:0 1px 2px rgba(18,52,77,.08),0 4px 14px -6px rgba(18,52,77,.18);
  --font:"Figtree","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --rail:#0B1F2E; --rail-2:#163650; --rail-ink:#93A9BC;
    --bg:#0F1720; --card:#17222E; --ink:#E4EBF1; --ink-2:#B0BDC8; --ink-3:#8796A3; --line:#2A3846; --line-2:#22303C;
    --blue:#6E97F0; --blue-2:#1C2D4D; --blue-ink:#9BB7F5;
    --green:#3CC79B; --green-bg:#0F3328; --amber:#E6B24A; --amber-bg:#3A2C0D; --red:#F07A6C; --red-bg:#3E1914;
    --violet:#B596EC; --violet-bg:#2A1E42; --teal:#4CC6CE; --teal-bg:#0E3336;
    --p-low:#3CC79B; --p-med:#6E97F0; --p-high:#F0A050; --p-urg:#F07A6C;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px -8px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --rail:#0B1F2E; --rail-2:#163650; --rail-ink:#93A9BC;
  --bg:#0F1720; --card:#17222E; --ink:#E4EBF1; --ink-2:#B0BDC8; --ink-3:#8796A3; --line:#2A3846; --line-2:#22303C;
  --blue:#6E97F0; --blue-2:#1C2D4D; --blue-ink:#9BB7F5;
  --green:#3CC79B; --green-bg:#0F3328; --amber:#E6B24A; --amber-bg:#3A2C0D; --red:#F07A6C; --red-bg:#3E1914;
  --violet:#B596EC; --violet-bg:#2A1E42; --teal:#4CC6CE; --teal-bg:#0E3336;
  --p-low:#3CC79B; --p-med:#6E97F0; --p-high:#F0A050; --p-urg:#F07A6C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px -8px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:72px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--font)}
a{color:var(--blue)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3,h4{margin:0;line-height:1.25;font-weight:700}
h1{font-size:28px;letter-spacing:-.01em}
h2{font-size:20px}
h3{font-size:16px}
p{margin:0 0 12px}
code,kbd{font-family:var(--mono);font-size:.86em;background:var(--line-2);border:1px solid var(--line);border-radius:4px;padding:0 5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- app shell: rail + top bar ---------- */
.shell{display:grid;grid-template-columns:64px 1fr;min-height:100vh}
.rail{background:var(--rail);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px;z-index:30}
.rail .logo{width:38px;height:38px;border-radius:10px;background:#fff;display:grid;place-items:center;margin-bottom:12px}
.rail .logo svg{width:24px;height:24px}
.rail a{width:48px;height:48px;border-radius:10px;display:grid;place-items:center;color:var(--rail-ink);text-decoration:none;position:relative}
.rail a svg{width:22px;height:22px}
.rail a:hover{background:var(--rail-2);color:#fff}
.rail a[aria-current="page"]{background:var(--rail-2);color:#fff}
.rail a[aria-current="page"]::before{content:"";position:absolute;left:-8px;top:12px;bottom:12px;width:3px;border-radius:2px;background:#fff}
.rail .tip{position:absolute;left:56px;white-space:nowrap;background:var(--rail);color:#fff;font-size:12px;padding:4px 8px;border-radius:6px;pointer-events:none;opacity:0}
.rail a:hover .tip{opacity:1}
.rail .spacer{flex:1}
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);height:56px;display:flex;align-items:center;gap:12px;padding:0 20px}
.top .title{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:0 10px;height:36px;width:min(320px,40vw)}
.search input{border:0;background:none;outline:0;font:inherit;color:var(--ink);width:100%}
.iconbtn{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.iconbtn svg{width:18px;height:18px}
main{min-width:0}
.page{max-width:1080px;margin:0 auto;padding:24px 20px 80px}
.page.narrow{max-width:820px}

.rail a .lbl{display:none}
/* mobile: rail becomes bottom tab bar */
@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;padding:6px 4px calc(env(safe-area-inset-bottom,0px) + 6px);gap:0}
  .rail .logo,.rail .spacer,.rail .tip{display:none}
  .rail a{width:auto;flex:1;height:50px;display:flex;flex-direction:column;gap:2px;font-size:10.5px}
  .rail a .lbl{display:block}
  .rail a[aria-current="page"]::before{left:30%;right:30%;top:-6px;bottom:auto;width:auto;height:3px}
  :root{padding-bottom:0}
  body{padding-bottom:calc(68px + env(safe-area-inset-bottom,0px))}
  .top{top:env(safe-area-inset-top,0px);padding:0 14px}
  .search{display:none}
  .page{padding:18px 14px 40px}
  h1{font-size:24px}
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--card)}

/* ---------- common bits ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.pad{padding:16px 18px}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.lede{font-size:17px;color:var(--ink-2);max-width:68ch}
.crumbs{font-size:13px;color:var(--ink-3);margin-bottom:10px}
.crumbs a{color:var(--ink-2);text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn.ghost{background:none;border-color:transparent;color:var(--blue)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:4px;background:var(--line-2);color:var(--ink-2);white-space:nowrap}
.tag.blue{background:var(--blue-2);color:var(--blue-ink)}
.tag.green{background:var(--green-bg);color:var(--green)}
.tag.amber{background:var(--amber-bg);color:var(--amber)}
.tag.red{background:var(--red-bg);color:var(--red)}
.tag.violet{background:var(--violet-bg);color:var(--violet)}
.tag.teal{background:var(--teal-bg);color:var(--teal)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.pri-Low{--pc:var(--p-low)} .pri-Medium{--pc:var(--p-med)} .pri-High{--pc:var(--p-high)} .pri-Urgent{--pc:var(--p-urg)}
.pri{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.pri .dot{background:var(--pc)}
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.widget{overflow-x:auto}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:760px){.g2,.g3{grid-template-columns:1fr}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--rail);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:100;box-shadow:var(--shadow)}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;align-items:center;margin-bottom:26px}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:34px;line-height:1.15;margin-bottom:10px}
@media (max-width:760px){.hero h1{font-size:27px}}
.miniconsole{border-radius:12px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);background:var(--card);font-size:12.5px}
.miniconsole .mc-top{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-weight:700}
.miniconsole .mc-row{display:grid;grid-template-columns:16px 1fr auto auto;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line-2)}
.miniconsole .mc-row:last-child{border-bottom:0}
.miniconsole .mc-sub{font-weight:600}
.miniconsole .mc-meta{color:var(--ink-3);font-size:11.5px}
.statgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0 26px}
@media (max-width:760px){.statgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{padding:14px 16px}
.stat b{display:block;font-size:24px}
.stat span{font-size:13px;color:var(--ink-3)}
.track{margin-top:28px}
.track h2{margin-bottom:4px}
.track > p{color:var(--ink-2);margin-bottom:12px}
.modlist{display:grid;gap:10px}
.mod{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:14px 16px;text-decoration:none;color:inherit}
.mod:hover{border-color:var(--blue)}
.mod .num{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-weight:800;background:var(--blue-2);color:var(--blue-ink)}
.mod h3{font-size:16px}
.mod p{margin:2px 0 0;color:var(--ink-2);font-size:14px}
.mod .prog{font-size:12px;color:var(--ink-3);text-align:right;white-space:nowrap}
.bar{height:6px;background:var(--line-2);border-radius:99px;overflow:hidden;width:90px;margin-top:4px}
.bar i{display:block;height:100%;background:var(--green)}

/* ---------- module + lesson ---------- */
.modhead{display:flex;gap:16px;align-items:flex-start;margin-bottom:18px}
.outcomes{margin:14px 0 20px;padding:14px 18px}
.outcomes ul{margin:6px 0 0;padding-left:20px}
.lessons{display:grid;gap:8px}
.les{display:flex;gap:12px;align-items:center;padding:12px 16px;text-decoration:none;color:inherit}
.les:hover{border-color:var(--blue)}
.les .chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:12px;color:#fff}
.les.done .chk{background:var(--green);border-color:var(--green)}
.les .t{flex:1}
.les .t small{display:block;color:var(--ink-3)}
.lesson{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:28px}
@media (max-width:1000px){.lesson{grid-template-columns:minmax(0,1fr)}.toc{display:none}}
.toc{position:sticky;top:76px;align-self:start;font-size:13px}
.toc b{display:block;margin-bottom:6px;color:var(--ink-3);font-weight:600}
.toc a{display:block;color:var(--ink-2);text-decoration:none;padding:4px 0 4px 10px;border-left:2px solid var(--line)}
.toc a:hover{color:var(--blue);border-left-color:var(--blue)}
.article{max-width:72ch}
.article > *{margin-bottom:14px}
.article h2{margin-top:30px;font-size:20px}
.article h3{margin-top:18px}
.article ul,.article ol{padding-left:22px}
.article li{margin:4px 0}
.layer{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink-3);margin:26px 0 6px;letter-spacing:.02em}
.layer i{width:18px;height:2px;background:var(--line);display:inline-block}
.topview{font-size:17px;line-height:1.55;padding:16px 18px;border-left:4px solid var(--blue);background:var(--card);border-radius:0 10px 10px 0;box-shadow:var(--shadow)}
.path{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:13px;font-weight:600;padding:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:8px}
.path span{background:var(--line-2);padding:2px 8px;border-radius:4px}
.path em{font-style:normal;color:var(--ink-3)}
.callout{padding:12px 16px;border-radius:8px;border:1px solid var(--line);background:var(--card)}
.callout b.h{display:block;margin-bottom:2px}
.callout.tip{border-left:4px solid var(--green)}
.callout.watch{border-left:4px solid var(--amber);background:var(--amber-bg);border-color:transparent}
.callout.example{border-left:4px solid var(--violet)}
.callout.real{border-left:4px solid var(--teal)}
.callout.plain{border-left:4px solid var(--teal);background:var(--teal-bg);border-color:transparent}
.refs{display:grid;gap:8px}
.refcard{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;text-decoration:none;color:inherit}
.refcard:hover{border-color:var(--blue)}
.refcard .ri{width:28px;height:28px;border-radius:7px;background:var(--blue-2);color:var(--blue-ink);display:grid;place-items:center;font-weight:800;flex:none}
.refcard b{display:block;color:var(--blue)}
.refcard small{display:block;color:var(--ink-2);font-size:13px}
.refcard small.url{color:var(--ink-3);font-size:12px;overflow-wrap:anywhere}
.guidebn{display:flex;gap:14px;align-items:center;padding:14px 16px;text-decoration:none;color:inherit;border-left:4px solid var(--teal);margin-top:4px}
.guidebn .gi{width:36px;height:36px;border-radius:50%;background:var(--teal-bg);color:var(--teal);display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.guidebn small{display:block;color:var(--ink-2);font-size:13.5px}
.guidebn .btn{margin-left:auto}
@media (max-width:760px){.guidebn .btn{display:none}}
.chip.right{border-color:var(--green);background:var(--green-bg);color:var(--green);opacity:1}
.chip.wrong{border-color:var(--red);background:var(--red-bg);color:var(--red);opacity:1}
.chip[disabled]{cursor:default}
.callout p:last-child{margin-bottom:0}
.steps{counter-reset:s;list-style:none;padding:0!important}
.steps li{counter-increment:s;position:relative;padding:8px 0 8px 40px;border-bottom:1px solid var(--line-2)}
.steps li::before{content:counter(s);position:absolute;left:0;top:8px;width:26px;height:26px;border-radius:50%;background:var(--blue-2);color:var(--blue-ink);font-weight:700;font-size:13px;display:grid;place-items:center}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line-2)}
th{background:var(--bg);font-weight:700;font-size:13px;color:var(--ink-2)}
tr:last-child td{border-bottom:0}
.quiz{padding:16px 18px}
.quiz .q{font-weight:700;margin-bottom:10px}
.quiz .opts{display:grid;gap:8px}
.quiz .opt{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px 12px;cursor:pointer;font-size:14px}
.quiz .opt:hover{border-color:var(--blue)}
.quiz .opt.right{border-color:var(--green);background:var(--green-bg)}
.quiz .opt.wrong{border-color:var(--red);background:var(--red-bg)}
.quiz .why{margin-top:10px;font-size:14px;color:var(--ink-2)}
.pager{display:flex;gap:12px;justify-content:space-between;margin-top:30px}
.pager a{flex:1;padding:12px 16px;text-decoration:none;color:inherit;font-size:14px}
.pager a small{display:block;color:var(--ink-3)}
.pager a.nx{text-align:right}
.donebar{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:14px 16px;margin-top:26px}

/* ---------- mock screens (static, annotated) ---------- */
.mock{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);box-shadow:var(--shadow);font-size:13px}
.mock .m-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--line);font-weight:600;font-size:12.5px;color:var(--ink-2)}
.mock .m-bar i{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}
.mock .m-body{padding:12px}
.mock .cap{padding:8px 12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3);background:var(--bg)}
.pin{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--violet);color:#fff;font-size:11px;font-weight:800;flex:none}
.legend{display:grid;gap:6px;margin-top:10px}
.legend div{display:flex;gap:8px;align-items:flex-start;font-size:13.5px}

/* ---------- practice desk (agent console) ---------- */
.desk{display:grid;grid-template-columns:300px minmax(0,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);min-height:560px;box-shadow:var(--shadow)}
@media (max-width:900px){.desk{grid-template-columns:1fr}.desk.open .tlist{display:none}.desk:not(.open) .tview{display:none}}
.tlist{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.tlist .tl-h{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.tlist select{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);padding:5px 6px}
.titem{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line-2);background:none;padding:10px 12px;cursor:pointer}
.titem:hover{background:var(--bg)}
.titem.sel{background:var(--blue-2)}
.titem .ts{font-weight:600;font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.titem .tm{font-size:12px;color:var(--ink-3);display:flex;gap:8px;align-items:center;margin-top:3px;flex-wrap:wrap}
.tview{display:grid;grid-template-columns:minmax(0,1fr) 260px;min-width:0}
@media (max-width:1100px){.tview{grid-template-columns:1fr}}
.conv{min-width:0;display:flex;flex-direction:column}
.conv .cv-h{padding:12px 16px;border-bottom:1px solid var(--line)}
.conv .cv-h h3{font-size:17px}
.conv .tools{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--bg)}
.msgs{padding:12px 16px;display:grid;gap:10px;flex:1;align-content:start}
.msg{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--card)}
.msg.note{background:var(--amber-bg);border-color:transparent}
.msg.agent{border-left:3px solid var(--blue)}
.msg.sys{background:none;border-style:dashed;color:var(--ink-3);font-size:12.5px;padding:6px 10px}
.msg .mh{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink-3);margin-bottom:4px;flex-wrap:wrap}
.msg .mh b{color:var(--ink)}
.msg .mb{font-size:14px;white-space:pre-wrap}
.composer{border-top:1px solid var(--line);padding:10px 16px;display:grid;gap:8px}

.mission .goals li.met{color:var(--green)}

.pick{border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;background:var(--card);text-align:left}

/* ---------- widgets ---------- */
.widget{padding:16px 18px}
.widget h4{margin-bottom:8px}
.matrix{display:grid;grid-template-columns:auto repeat(3,1fr);gap:4px;font-size:13px}
.matrix .hd{font-weight:700;color:var(--ink-3);padding:6px;text-align:center}
.matrix .cell{border:2px solid transparent;border-radius:6px;padding:10px 6px;text-align:center;font-weight:700;cursor:pointer;background:var(--bg)}
.matrix .cell.on{border-color:var(--ink)}
.matrix .cell.Low{color:var(--p-low)}.matrix .cell.Medium{color:var(--p-med)}.matrix .cell.High{color:var(--p-high)}.matrix .cell.Urgent{color:var(--p-urg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
.flowline{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.node{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card);font-size:13px;min-width:120px}
.node b{display:block;font-size:11px;color:var(--ink-3);font-weight:700}
.node.ev{border-top:3px solid var(--blue)}.node.cd{border-top:3px solid var(--amber)}.node.ac{border-top:3px solid var(--green)}
.arrow{color:var(--ink-3)}
.slot{border:2px dashed var(--line);border-radius:8px;padding:8px 10px;min-width:150px;min-height:48px;font-size:13px;color:var(--ink-3);background:var(--bg)}
.slot.filled{border-style:solid;color:var(--ink);background:var(--card)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;background:var(--card);cursor:pointer}
.chip:hover{border-color:var(--blue)}
.chip.used{opacity:.4;pointer-events:none}
.lifecycle{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px}
.lc{flex:1;min-width:96px;border-radius:6px;padding:8px;font-size:12px;font-weight:700;text-align:center;background:var(--bg);border:1px solid var(--line);cursor:pointer}
.lc.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.lc.past{background:var(--blue-2);color:var(--blue-ink)}
.cmdb{width:100%;height:auto;display:block}
.cmdb .n rect{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.cmdb .n text{fill:var(--ink);font:600 12px var(--font)}
.cmdb .n.hit rect{fill:var(--red-bg);stroke:var(--red)}
.cmdb .n.src rect{fill:var(--red);stroke:var(--red)}
.cmdb .n.src text{fill:#fff}
.cmdb line{stroke:var(--line);stroke-width:1.5}
.cmdb line.hit{stroke:var(--red);stroke-width:2.5}
.cmdb .n{cursor:pointer}
.flash{display:grid;place-items:center;min-height:180px;text-align:center;padding:24px;cursor:pointer;font-size:18px;font-weight:700}
.flash.back{font-size:15px;font-weight:400;color:var(--ink-2)}
.gl{display:grid;gap:8px}
.gl .term{padding:12px 16px}
.gl .term b{display:block}
.hide{display:none!important}

    { id: "ml1-workflow", title: "The ML workflow and your tools", min: 8, blocks: [

  { id: "ml2", title: "Data: the fuel", short: "Features, labels, cleaning, visualising and splitting",

    lessons: [
    { id: "ml2-data", title: "Features, labels and cleaning", min: 9, blocks: [

      ["top", "A dataset is a table. Each row is one example. The columns you use to predict are features; the column you want to predict is the label."],
      ["india", "Mandi onion prices", "Each row: a market day at a mandi. Features: date, state, mandi, arrival quantity (tonnes), rainfall last week. Label: modal price per quintal. Predicting the price from the features is a regression problem."],
      ["table", ["Date", "Mandi", "Arrivals (t)", "Rain (mm)", "Price (₹/q)"], [
        ["2026-09-01", "Lasalgaon", "1,850", "12", "2,150"],
        ["2026-09-02", "Lasalgaon", "1,420", "48", "2,380"],
        ["2026-09-02", "Pimpalgaon", "—", "48", "2,410"],
        ["2026-09-03", "Lasalgaon", "1,950", "3", "21,000"]

      ["p", "Spot the problems: a **missing value** (Pimpalgaon arrivals) and an **outlier** (₹21,000 is probably a typing mistake for ₹2,100)."],
      ["table", ["Problem", "Typical fix"], [
        ["Missing values", "Drop the row if rare; otherwise fill with median or a sensible value"],
        ["Duplicates", "Remove exact repeats"],
        ["Outliers and typos", "Check against reality; correct or remove"],
        ["Mixed units", "Convert everything to one unit (kg vs quintal)"],
        ["Text categories", "Turn into numbers (one-hot encoding)"]

      ["code", "python", "import pandas as pd\ndf = pd.read_csv(\"onion_prices.csv\")\nprint(df.isna().sum())          # missing values per column\ndf = df.drop_duplicates()\ndf = df[df[\"price\"] < 10000]    # remove impossible prices\ndf[\"arrivals\"] = df[\"arrivals\"].fillna(df[\"arrivals\"].median())\ndf = pd.get_dummies(df, columns=[\"mandi\"])  # text -> numbers"],

        ["Validation set", "10–15%", "Choosing between models and settings"],
        ["Test set", "10–15%", "One final, honest score; touch it only once"]
      ]],
      ["watch", "Data leakage", "If information from the answer sneaks into the features, scores look amazing and the model fails in real life. Example: predicting whether a loan will default using a column \"recovery agent assigned\", which only exists *after* default. For time-based data, always train on the past and test on the future."],

    ]},

  { id: "ml3", title: "Regression: predicting numbers", short: "Lines, learning by gradient descent, curves, probabilities and error measures",
    outcomes: ["Fit and read a linear regression.", "Explain how a model learns with gradient descent.", "Recognise overfitting and choose good error measures."],
    lessons: [
    { id: "ml3-linear", title: "Linear regression: the best straight line", min: 10, blocks: [
      ["layer", "Top view"],
      ["top", "Linear regression draws the straight line that passes as close as possible to all your points, then uses it to predict new values."],
      ["p", "The line is **y = m·x + c**: m is the slope (how much rent rises per extra sq ft) and c is the starting value. \"As close as possible\" is measured by the **mean squared error (MSE)**: the average of the squared vertical gaps between points and the line."],
      ["widget", "linreg"],
      ["india", "Reading the result", "If the model says slope = 0.022 and intercept = 2.1 (in ₹ thousand), every extra 100 sq ft adds about ₹2,200 to the monthly rent in that area."],
      ["code", "python", "from sklearn.linear_model import LinearRegression\nmodel = LinearRegression().fit(X_train, y_train)\nprint(\"slope:\", model.coef_, \"intercept:\", model.intercept_)\nprint(\"R^2 on test:\", model.score(X_test, y_test))"],
      ["quiz", "In the simulator, what happens to the MSE when the line moves further from the points?", ["It goes down", "It goes up", "It stays the same", "It becomes negative"], 1, "Bigger gaps mean bigger squared errors, so the MSE rises."]
    ]},
    { id: "ml3-gd", title: "How models learn: gradient descent", min: 9, blocks: [
      ["layer", "Top view"],
      ["top", "Learning = repeatedly nudging the model's numbers in the direction that reduces the error, a little at a time, like walking downhill in fog."],
      ["plain", "Walking down a hill in the dark", "You can't see the valley, but you can feel which way the ground slopes under your feet. Take a small step downhill, feel again, repeat. The **learning rate** is your step size: too small and you take forever; too big and you jump over the valley and bounce around."],
      ["widget", "gd"],
      ["video", "IHZwWFHWa-w", "Gradient descent, how neural networks learn", "3Blue1Brown", "21 min"],
      ["quiz", "With a very large learning rate, what usually happens?", ["Learning is slow but steady", "The steps overshoot and the error can grow instead of shrink", "Nothing changes", "The model becomes fair"], 1, "Too-large steps jump past the minimum and can diverge. Try it in the simulator."]
    ]},
    { id: "ml3-poly", title: "Curves, overfitting and underfitting", min: 9, blocks: [
      ["layer", "Top view"],
      ["top", "A model that is too simple misses the pattern (underfitting). A model that is too flexible memorises the noise (overfitting). Good models sit in between."],
      ["widget", "poly"],
      ["table", ["", "Underfitting", "Good fit", "Overfitting"], [
        ["Training error", "High", "Low", "Very low"],
        ["Test error", "High", "Low", "High"],
        ["Like a student who…", "didn't study", "understood the chapter", "memorised the guide answers word for word"]
      ]],
      ["list", ["**Fix underfitting**: more useful features, a more flexible model.", "**Fix overfitting**: more data, simpler model, regularisation (penalise extreme coefficients), cross-validation."]],
      ["quiz", "In the simulator, the degree-10 curve wiggles through every training point but test error is huge. This is…", ["Underfitting", "A good fit", "Overfitting", "Data leakage"], 2, "Perfect on training, bad on new data: overfitting."]
    ]},
    { id: "ml3-logistic", title: "Logistic regression: yes or no", min: 8, blocks: [
      ["layer", "Top view"],
      ["top", "Logistic regression predicts a probability between 0 and 1, using an S-shaped curve, and then a threshold turns it into yes or no."],
      ["p", "Despite its name it is used for **classification**. The S-curve is the **sigmoid**: very negative scores become probabilities near 0, very positive ones near 1."],
      ["india", "Will the EMI be paid on time?", "Features: income, existing EMIs, UPI spending pattern, past delays. The model outputs 0.83: an 83% chance of paying on time. With a threshold of 0.5 the answer is \"yes\"; a cautious lender might use 0.7."],
      ["code", "python", "from sklearn.linear_model import LogisticRegression\nclf = LogisticRegression(max_iter=1000).fit(X_train, y_train)\nprob = clf.predict_proba(X_test)[:, 1]   # probability of class 1\npred = (prob >= 0.7).astype(int)         # your own threshold"],
      ["quiz", "Logistic regression outputs…", ["Any number from minus to plus infinity", "A probability between 0 and 1", "Only 0 or 1, never in between", "A cluster number"], 1, "It outputs a probability; the threshold makes the final yes/no."]
    ]},
    { id: "ml3-metrics", title: "Measuring regression error", min: 6, blocks: [
      ["layer", "Top view"],
      ["top", "Three numbers tell you how good a number-predicting model is: average miss (MAE), how much big misses hurt (RMSE), and how much of the pattern it explains (R²)."],
      ["table", ["Measure", "Meaning", "Onion example"], [
        ["MAE", "Average size of the error", "Off by ₹120 per quintal on average"],
        ["RMSE", "Like MAE but punishes big misses more", "₹180: a few days were badly wrong"],
        ["R²", "Share of variation explained (1 = perfect, 0 = no better than the average)", "0.78: explains 78% of price movement"]
      ]],
      ["tip", "Always compare with a baseline", "Before celebrating, compare with a dumb rule like \"tomorrow's price = today's price\". If your model doesn't beat that, it isn't useful yet."],
      ["refs", [["ML for Beginners: Regression lessons", "https://github.com/microsoft/ML-For-Beginners/tree/main/2-Regression", "Pumpkin-price notebooks with full code, quizzes and assignments."]]]

    { id: "ml4-metrics", title: "Accuracy lies: precision and recall", min: 10, blocks: [
      ["layer", "Top view"],
      ["top", "When one class is rare (fraud, disease), accuracy is misleading. Precision asks \"when I raise an alarm, am I right?\"; recall asks \"how many real cases did I catch?\""],
      ["india", "UPI fraud", "Out of 10,000 payments, 50 are fraud. A model that says \"never fraud\" is 99.5% accurate and completely useless. What matters: of the fraud cases, how many did we catch (recall), and of the payments we blocked, how many were really fraud (precision)?"],
      ["widget", "confusion"],
      ["table", ["Cell", "Meaning"], [["True positive (TP)", "Fraud, and we flagged it"], ["False positive (FP)", "Genuine, but we blocked it: an angry customer"], ["False negative (FN)", "Fraud we missed: money lost"], ["True negative (TN)", "Genuine, and we let it through"]]],
      ["p", "**Precision** = TP ÷ (TP + FP). **Recall** = TP ÷ (TP + FN). **F1** balances both. Moving the threshold trades one for the other; the business decides which mistake is more expensive."],
      ["quiz", "For cancer screening, missing a real case is very costly. Which should you prioritise?", ["Precision", "Recall", "Accuracy", "Training speed"], 1, "Recall: catch as many real cases as possible, then confirm with further tests."]

    lessons: [
    { id: "ml5-kmeans", title: "k-means, step by step", min: 9, blocks: [

    { id: "ml5-eval", title: "How many clusters?", min: 6, blocks: [

  { id: "fd2", title: "NumPy and pandas", short: "Fast arrays and data tables: the daily tools of every data job",

    lessons: [
    { id: "fd2-numpy", title: "NumPy: maths on whole arrays", min: 12, blocks: [

      ["py", "import numpy as np\nsqft = np.array([450, 600, 750, 900, 1100])\nrent = np.array([12, 15, 19, 22, 27])          # Rs thousand\n\nprint(\"Rent per sq ft (Rs):\", (rent * 1000 / sqft).round(1))   # element-wise, no loop\nprint(\"Mean rent:\", rent.mean(), \"| std:\", rent.std().round(2))\nprint(\"Flats over 20k:\", sqft[rent > 20])                      # boolean mask\n\nm = np.array([[1, 2], [3, 4]])\nprint(\"Shape:\", m.shape, \"| column means:\", m.mean(axis=0))"],

      ["pyex", "Standardise the scores", "Standardise `x` into `z` so it has mean 0 and standard deviation 1: subtract the mean, divide by the standard deviation. Models train better on standardised features.", "import numpy as np\nx = np.array([52., 61., 70., 74., 88., 95.])\nz = x  # fix me\nprint(z.round(2))", "import numpy as np\nassert abs(z.mean()) < 1e-9, 'mean of z should be 0'\nassert abs(z.std() - 1) < 1e-9, 'std of z should be 1'", "z = (x - x.mean()) / x.std()", "z = (x - x.mean()) / x.std()"]

    { id: "fd2-group", title: "Group, merge and clean", min: 16, blocks: [
      ["layer", "Top view"],
      ["top", "Most real questions are \"per something\": average price per state, sales per month. groupby answers them; merge joins tables; cleaning makes them trustworthy."],
      ["py", "import pandas as pd, numpy as np\nsales = pd.DataFrame({\n    \"date\": pd.to_datetime([\"2026-09-01\",\"2026-09-01\",\"2026-09-02\",\"2026-09-02\",\"2026-09-03\",\"2026-09-03\"]),\n    \"store\": [\"S1\",\"S2\",\"S1\",\"S2\",\"S1\",\"S2\"],\n    \"amount\": [5200, 3100, np.nan, 2900, 6100, 3300]})\nstores = pd.DataFrame({\"store\": [\"S1\",\"S2\"], \"city\": [\"Pune\",\"Nashik\"]})\n\nprint(\"Missing per column:\\n\", sales.isna().sum(), \"\\n\")\nsales[\"amount\"] = sales[\"amount\"].fillna(sales.groupby(\"store\")[\"amount\"].transform(\"median\"))\nfull = sales.merge(stores, on=\"store\", how=\"left\")\nprint(full.groupby(\"city\")[\"amount\"].agg([\"sum\", \"mean\", \"count\"]), \"\\n\")\nprint(full.assign(day=full.date.dt.day_name()).pivot_table(index=\"day\", columns=\"city\", values=\"amount\", aggfunc=\"sum\"))"],

  { id: "fd3", title: "SQL for data", short: "Ask questions of databases: the most requested data skill",
    outcomes: ["Write SELECT queries with filters and sorting.", "Aggregate with GROUP BY and HAVING.", "Join tables and use a window function."],
    lessons: [
    { id: "fd3-select", title: "SELECT, WHERE, ORDER BY", min: 14, blocks: [
      ["layer", "Top view"],
      ["top", "SQL asks a database for exactly the rows and columns you need. Nearly every company stores data in SQL databases, so nearly every data job tests it."],
      ["p", "These cells run a real SQLite database inside your browser. The helper `q()` runs a query and shows the result as a table."],
      ["py", "import sqlite3, pandas as pd\ncon = sqlite3.connect(\":memory:\")\npd.DataFrame({\n  \"order_id\": range(1, 9),\n  \"customer\": [\"Asha\",\"Rohan\",\"Asha\",\"Fatima\",\"Sneha\",\"Rohan\",\"Karan\",\"Asha\"],\n  \"city\": [\"Pune\",\"Chennai\",\"Pune\",\"Mumbai\",\"Bengaluru\",\"Chennai\",\"Mumbai\",\"Pune\"],\n  \"amount\": [1250, 640, 2300, 980, 4100, 720, 1500, 560],\n  \"paid_by\": [\"UPI\",\"Card\",\"UPI\",\"UPI\",\"Card\",\"UPI\",\"COD\",\"UPI\"]}).to_sql(\"orders\", con, index=False)\ndef q(sql): return pd.read_sql_query(sql, con)\n\nprint(q(\"\"\"\nSELECT customer, city, amount\nFROM orders\nWHERE paid_by = 'UPI' AND amount > 900\nORDER BY amount DESC\n\"\"\"))"],
      ["table", ["Clause", "Does", "Order it runs"], [["FROM", "Which table", "1"], ["WHERE", "Filter rows", "2"], ["GROUP BY", "Make groups", "3"], ["HAVING", "Filter groups", "4"], ["SELECT", "Pick / compute columns", "5"], ["ORDER BY", "Sort", "6"], ["LIMIT", "Keep first n", "7"]]],
      ["pyex", "Top Pune orders", "Using the same `orders` table, write a query in `sql` returning the `order_id` and `amount` of Pune orders, largest first. (Run the cell above first.)", "sql = \"\"\"\nSELECT ...\n\"\"\"\nres = q(sql)\nprint(res)", "assert list(res.columns) == ['order_id', 'amount'], 'select order_id and amount'\nassert list(res.amount) == [2300, 1250, 560], 'Pune orders, largest first'", "SELECT order_id, amount FROM orders WHERE city = 'Pune' ORDER BY amount DESC", "sql = \"SELECT order_id, amount FROM orders WHERE city = 'Pune' ORDER BY amount DESC\"\nres = q(sql)"]
    ]},
    { id: "fd3-group", title: "GROUP BY, JOIN and window functions", min: 16, blocks: [
      ["layer", "Top view"],
      ["top", "GROUP BY summarises per group, JOIN combines tables on a shared key, and window functions rank or total rows without collapsing them."],
      ["py", "import sqlite3, pandas as pd\ncon = sqlite3.connect(\":memory:\")\npd.DataFrame({\"order_id\": range(1, 9), \"customer\": [\"Asha\",\"Rohan\",\"Asha\",\"Fatima\",\"Sneha\",\"Rohan\",\"Karan\",\"Asha\"],\n  \"amount\": [1250, 640, 2300, 980, 4100, 720, 1500, 560]}).to_sql(\"orders\", con, index=False)\npd.DataFrame({\"customer\": [\"Asha\",\"Rohan\",\"Fatima\",\"Sneha\",\"Karan\"],\n  \"segment\": [\"Gold\",\"Silver\",\"Silver\",\"Gold\",\"New\"]}).to_sql(\"customers\", con, index=False)\ndef q(sql): return pd.read_sql_query(sql, con)\n\nprint(q(\"\"\"\nSELECT c.segment, COUNT(*) AS orders, SUM(o.amount) AS revenue\nFROM orders o JOIN customers c ON o.customer = c.customer\nGROUP BY c.segment\nHAVING COUNT(*) >= 2\nORDER BY revenue DESC\"\"\"), \"\\n\")\n\nprint(q(\"\"\"\nSELECT customer, amount,\n       RANK() OVER (PARTITION BY customer ORDER BY amount DESC) AS rank_in_customer,\n       SUM(amount) OVER (PARTITION BY customer) AS customer_total\nFROM orders ORDER BY customer, rank_in_customer\"\"\"))"],
      ["table", ["Join", "Keeps"], [["INNER JOIN", "Only rows matching in both tables"], ["LEFT JOIN", "All rows from the left table, matches where they exist (NULL otherwise)"]]],
      ["watch", "WHERE vs HAVING", "WHERE filters rows before grouping; HAVING filters groups after. \"Customers with more than 2 orders\" needs HAVING COUNT(*) > 2."],
      ["pyex", "Spend per customer", "Write `sql` returning each `customer` with `total` spend, only customers whose total is above 2,000, highest first. (Run the cell above first.)", "sql = \"\"\"\nSELECT ...\n\"\"\"\nres = q(sql)\nprint(res)", "assert list(res.customer) == ['Asha', 'Sneha'], 'expected Asha (4110) then Sneha (4100)'", "GROUP BY customer, HAVING SUM(amount) > 2000, ORDER BY total DESC.", "sql = \"SELECT customer, SUM(amount) AS total FROM orders GROUP BY customer HAVING SUM(amount) > 2000 ORDER BY total DESC\"\nres = q(sql)"]
    ]}
  ]},
  { id: "fd4", title: "Statistics and probability", short: "Describing data, distributions, Bayes and testing ideas",
    outcomes: ["Summarise data with the right centre and spread.", "Explain distributions and the central limit theorem.", "Use Bayes' rule and read an A/B test."],
    lessons: [
    { id: "fd4-describe", title: "Centre, spread and outliers", min: 12, blocks: [
      ["layer", "Top view"],
      ["top", "The mean is pulled by extreme values; the median is not. Always report spread too: two cities with the same average rent can feel completely different."],
      ["py", "import numpy as np\n# Monthly salaries in a small company (Rs thousand): one founder skews everything\ns = np.array([28, 30, 32, 35, 35, 38, 42, 45, 50, 450])\nprint(\"Mean:\", s.mean(), \"| Median:\", np.median(s))\nq1, q3 = np.percentile(s, [25, 75]); iqr = q3 - q1\nprint(\"Std dev:\", s.std().round(1), \"| IQR:\", iqr)\nprint(\"Outliers (beyond 1.5 x IQR):\", s[(s < q1 - 1.5*iqr) | (s > q3 + 1.5*iqr)])"],
      ["table", ["Measure", "Use when"], [["Mean", "Symmetric data without big outliers"], ["Median", "Skewed data: salaries, house prices, delivery times"], ["Standard deviation", "Typical distance from the mean"], ["IQR (Q3 − Q1)", "Spread that ignores extremes; basis of the outlier rule"]]],
      ["quiz", "A news report says the \"average\" salary in a startup is Rs 1.2 lakh, but most employees earn Rs 40–60k. What's happening?", ["Calculation error", "A few very high salaries pull the mean up; the median is more honest here", "The median is always higher", "Salaries can't be averaged"], 1, "Skewed data: report the median."]
    ]},
    { id: "fd4-dist", title: "Distributions and the central limit theorem", min: 14, blocks: [
      ["layer", "Top view"],
      ["top", "A distribution shows how often each value happens. The central limit theorem says averages of samples look bell-shaped even when the original data doesn't, which is why so much of statistics works."],
      ["widget", "clt"],
      ["list", ["**Normal (bell curve)**: heights, measurement errors.", "**Right-skewed**: incomes, delivery times, file sizes.", "**Uniform**: a fair die.", "**Binomial**: number of successes in n tries (conversions out of 100 visitors)."]],
      ["py", "import numpy as np\nrng = np.random.default_rng(0)\ndelivery = rng.exponential(scale=30, size=100_000)          # skewed delivery times, minutes\nmeans = rng.exponential(scale=30, size=(5_000, 40)).mean(axis=1)  # 5,000 samples of 40 orders\nprint(\"Raw data   mean %.1f  std %.1f\" % (delivery.mean(), delivery.std()))\nprint(\"Sample means mean %.1f  std %.2f  (theory: %.2f)\" % (means.mean(), means.std(), 30/np.sqrt(40)))"],
      ["tip", "Why ML people care", "The standard error (σ/√n) tells you how precise an average is. It is the basis of confidence intervals, A/B tests and of judging whether one model is really better than another."]
    ]},
    { id: "fd4-prob", title: "Probability and Bayes' rule", min: 14, blocks: [
      ["layer", "Top view"],
      ["top", "Bayes' rule updates a belief with evidence. Its big lesson: when something is rare, even an accurate test produces many false alarms."],
      ["widget", "bayes"],
      ["p", "**P(disease | positive) = P(positive | disease) × P(disease) ÷ P(positive)**. Thinking in counts of people (as the simulator does) is the easiest way to get it right."],
      ["india", "Fraud alerts", "If 1 in 1,000 UPI payments is fraud and a detector catches 99% of fraud with a 2% false-alarm rate, most alerts are still false alarms. That's why fraud teams review alerts instead of blocking accounts automatically."],
      ["quiz", "A disease affects 1% of people. A test is 95% sensitive with a 5% false-positive rate. Roughly what share of positive results are real?", ["95%", "About 16%", "50%", "1%"], 1, "Out of 10,000 people: 95 true positives and about 495 false positives, so 95 ÷ 590 ≈ 16%."]
    ]},
    { id: "fd4-test", title: "Hypothesis tests, A/B tests and causation", min: 15, blocks: [
      ["layer", "Top view"],
      ["top", "A test asks: could this difference just be luck? The p-value is how surprising the data would be if there were truly no difference. Small p means luck alone is unlikely, not that the effect is big or important."],
      ["py", "import numpy as np\nfrom scipy import stats\nrng = np.random.default_rng(1)\n# A/B test: old vs new checkout page, 1 = purchased\nA = rng.binomial(1, 0.060, 4000)\nB = rng.binomial(1, 0.071, 4000)\nprint(\"Conversion A: %.2f%%  B: %.2f%%\" % (A.mean()*100, B.mean()*100))\nt, p = stats.ttest_ind(B, A)\nprint(\"p-value: %.4f\" % p)\ndiff = B.mean() - A.mean(); se = np.sqrt(A.var()/len(A) + B.var()/len(B))\nprint(\"95%% CI for the lift: %.2f%% to %.2f%%\" % ((diff-1.96*se)*100, (diff+1.96*se)*100))"],
      ["table", ["Idea", "Plain meaning"], [["Null hypothesis", "\"No real difference\""], ["p-value", "Chance of data this extreme if the null were true"], ["Significance level (often 0.05)", "Your bar for \"unlikely to be luck\""], ["Confidence interval", "Plausible range for the true effect"], ["Power", "Chance of detecting a real effect; needs enough data"]]],
      ["watch", "Correlation is not causation", "Ice-cream sales and drowning both rise in summer; heat causes both. Only a randomised experiment (like an A/B test) or careful causal analysis shows cause."],
      ["quiz", "p = 0.03 means…", ["There is a 3% chance B is better", "If there were no real difference, data this extreme would appear about 3% of the time", "B is 3% better", "The test is 97% accurate"], 1, "It's about how surprising the data is under \"no difference\"."]
    ]}
  ]},
  { id: "fd5", title: "Maths for machine learning", short: "Vectors, matrices and gradients, explained without fear",
    outcomes: ["Compute dot products and cosine similarity.", "See a neural-network layer as matrix multiplication.", "Explain derivatives and gradients numerically."],
    lessons: [
    { id: "fd5-vectors", title: "Vectors, dot products and similarity", min: 13, blocks: [
      ["layer", "Top view"],
      ["top", "A vector is a list of numbers describing something. The dot product measures how much two vectors point the same way; cosine similarity turns that into a score from −1 to 1."],
      ["widget", "vecdot"],
      ["py", "import numpy as np\n# Customers as vectors: [snacks, staples, electronics] monthly spend (Rs '00)\nasha  = np.array([8, 20, 1])\nrohan = np.array([7, 18, 2])\nkaran = np.array([1, 3, 40])\ndef cos(a, b): return a @ b / (np.linalg.norm(a) * np.linalg.norm(b))\nprint(\"asha vs rohan: %.2f\" % cos(asha, rohan))\nprint(\"asha vs karan: %.2f\" % cos(asha, karan))"],
      ["p", "This is exactly how embeddings are compared in search, recommendations and RAG."],
      ["pyex", "Write cosine similarity", "Complete `cosine(a, b)` using the dot product and vector lengths (norms), without np.linalg.", "import numpy as np\ndef cosine(a, b):\n    # dot = sum of a*b ; length = sqrt(sum of squares)\n    return 0.0\nprint(cosine(np.array([1., 0.]), np.array([1., 1.])))", "import numpy as np\nassert abs(cosine(np.array([1.,0.]), np.array([1.,1.])) - 0.7071) < 1e-3, 'cos 45 degrees is 0.707'\nassert abs(cosine(np.array([1.,2.]), np.array([-2.,1.]))) < 1e-9, 'perpendicular vectors give 0'", "dot = (a*b).sum(); return dot / (np.sqrt((a*a).sum()) * np.sqrt((b*b).sum()))", "def cosine(a, b):\n    return (a*b).sum() / (np.sqrt((a*a).sum()) * np.sqrt((b*b).sum()))"]
    ]},
    { id: "fd5-matrix", title: "Matrices: a neural-network layer is one multiplication", min: 12, blocks: [
      ["layer", "Top view"],
      ["top", "A matrix is a grid of numbers. Multiplying it by a vector transforms the vector. One layer of a neural network is literally output = activation(W·x + b)."],
      ["py", "import numpy as np\nx = np.array([0.8, 0.2, 0.5])                 # 3 input features\nW = np.array([[0.2, -0.5, 1.0],               # 2 neurons x 3 weights\n              [0.7,  0.1, -0.3]])\nb = np.array([0.1, -0.2])\nz = W @ x + b                                  # matrix-vector product\nprint(\"Before activation:\", z.round(3))\nprint(\"After ReLU:\", np.maximum(0, z).round(3))\nprint(\"Shapes: W\", W.shape, \"x\", x.shape, \"-> z\", z.shape)"],
      ["tip", "The shape rule", "(m × n) @ (n,) gives (m,). The inner sizes must match. Most beginner deep-learning bugs are shape mismatches; printing `.shape` fixes half of them."]
    ]},
    { id: "fd5-calculus", title: "Derivatives and gradients", min: 14, blocks: [

    s.innerHTML = '<span>Mean of averages: <b>' + m.toFixed(1) + '</b></span><span>Spread of averages (standard error): <b>' + sd.toFixed(2) + '</b></span><span>' + (n >= 30 ? "<b>Bell-shaped ✓</b>" : n === 1 ? "n = 1 just copies the population" : "Getting more bell-shaped…") + '</span>';
  }
  $("#sh", c).addEventListener("change", function (e) { shape = e.target.value; run(); });
  $("#n", c).addEventListener("input", function (e) { n = +e.target.value; $("#nv", c).textContent = n; run(); });
  $("#re", c).addEventListener("click", run);
  run();
};

W.bayes = function (el) {
  el.innerHTML = '<h4>Bayes in 1,000 people</h4><p class="small muted" style="margin:-4px 0 10px">Each dot is a person tested. Change how rare the condition is and how good the test is, then look at who tests positive.</p>';
  var st = { prev: 2, sens: 95, fpr: 5 };
  var grid = document.createElement("div"); grid.style.cssText = "display:grid;grid-template-columns:repeat(40,1fr);gap:2px;max-width:520px"; el.appendChild(grid);
  var c = ctrl(el, '<label>Has the condition <input type="range" id="p" min="0.1" max="20" step="0.1" value="2"> <b id="pv">2%</b></label><label>Catches true cases <input type="range" id="s" min="50" max="100" step="1" value="95"> <b id="sv">95%</b></label><label>False alarms <input type="range" id="f" min="0" max="20" step="0.5" value="5"> <b id="fv">5%</b></label>');
  var s = stats(el);
  function draw() {
    var N = 1000, sick = Math.round(N * st.prev / 100), tp = Math.round(sick * st.sens / 100), fn = sick - tp, fp = Math.round((N - sick) * st.fpr / 100), tn = N - sick - fp;
    var cells = [], k;
    for (k = 0; k < tp; k++) cells.push("var(--c-dl)"); for (k = 0; k < fn; k++) cells.push("color-mix(in srgb, var(--c-dl) 35%, transparent)"); for (k = 0; k < fp; k++) cells.push("var(--c-gen)"); for (k = 0; k < tn; k++) cells.push("var(--line)");
    grid.innerHTML = cells.map(function (col) { return '<span style="aspect-ratio:1;border-radius:50%;background:' + col + '"></span>'; }).join("");
    var ppv = tp + fp ? tp / (tp + fp) : 0;
    s.innerHTML = '<span><span style="color:var(--c-dl)">●</span> true positive <b>' + tp + '</b></span><span><span style="color:var(--c-gen)">●</span> false alarm <b>' + fp + '</b></span><span>missed <b>' + fn + '</b></span><span>If you test positive, chance it\'s real: <b>' + (ppv * 100).toFixed(1) + '%</b></span>';
  }
  [["p", "prev", "pv"], ["s", "sens", "sv"], ["f", "fpr", "fv"]].forEach(function (x) { $("#" + x[0], c).addEventListener("input", function (e) { st[x[1]] = +e.target.value; $("#" + x[2], c).textContent = st[x[1]] + "%"; draw(); }); });
  draw();
};

W.vecdot = function (el) {
  el.innerHTML = '<h4>Drag two vectors</h4><p class="small muted" style="margin:-4px 0 10px">Drag the arrow tips. Watch the dot product and cosine similarity: 1 = same direction, 0 = unrelated (perpendicular), −1 = opposite.</p>';
  var P = canvas(el, 260), g = P.g, a = [3, 1], b = [1, 3], drag = null, sc = Math.min(P.W, P.H) / 10, O = [P.W / 2, P.H / 2];
  var s = stats(el);
  function px(v) { return [O[0] + v[0] * sc, O[1] - v[1] * sc]; }
  function arrow(v, col, lab) { var p = px(v); g.strokeStyle = col; g.fillStyle = col; g.lineWidth = 3; g.beginPath(); g.moveTo(O[0], O[1]); g.lineTo(p[0], p[1]); g.stroke(); g.beginPath(); g.arc(p[0], p[1], 8, 0, 7); g.fill(); g.font = "700 13px sans-serif"; g.fillText(lab + " (" + v[0].toFixed(1) + ", " + v[1].toFixed(1) + ")", p[0] + 10, p[1] - 8); g.lineWidth = 1; }
  function draw() {
    g.clearRect(0, 0, P.W, P.H); g.strokeStyle = css("--line"); g.beginPath(); g.moveTo(0, O[1]); g.lineTo(P.W, O[1]); g.moveTo(O[0], 0); g.lineTo(O[0], P.H); g.stroke();
    arrow(a, css("--c-ml"), "a"); arrow(b, css("--c-dl"), "b");
    var dot = a[0] * b[0] + a[1] * b[1], na = Math.hypot(a[0], a[1]), nb = Math.hypot(b[0], b[1]), cos = na && nb ? dot / (na * nb) : 0;
    s.innerHTML = '<span>a · b = ' + a[0].toFixed(1) + '×' + b[0].toFixed(1) + ' + ' + a[1].toFixed(1) + '×' + b[1].toFixed(1) + ' = <b>' + dot.toFixed(2) + '</b></span><span>|a| = <b>' + na.toFixed(2) + '</b>, |b| = <b>' + nb.toFixed(2) + '</b></span><span>cosine = <b>' + cos.toFixed(3) + '</b> (angle ' + (Math.acos(Math.max(-1, Math.min(1, cos))) * 180 / Math.PI).toFixed(0) + '°)</span>';
  }
  function at(e) { var r = P.cv.getBoundingClientRect(), t = e.touches ? e.touches[0] : e; return [(t.clientX - r.left - O[0]) / sc, -(t.clientY - r.top - O[1]) / sc]; }
  function down(e) { var q = at(e); drag = Math.hypot(q[0] - a[0], q[1] - a[1]) < Math.hypot(q[0] - b[0], q[1] - b[1]) ? a : b; move(e); }
  function move(e) { if (!drag) return; e.preventDefault(); var q = at(e); drag[0] = Math.max(-4.8, Math.min(4.8, Math.round(q[0] * 2) / 2)); drag[1] = Math.max(-4.8, Math.min(4.8, Math.round(q[1] * 2) / 2)); draw(); }
  P.cv.addEventListener("mousedown", down); P.cv.addEventListener("mousemove", move); window.addEventListener("mouseup", function () { drag = null; });
  P.cv.addEventListener("touchstart", down, { passive: false }); P.cv.addEventListener("touchmove", move, { passive: false }); P.cv.addEventListener("touchend", function () { drag = null; });
  draw();
};
})();
